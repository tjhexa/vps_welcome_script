# Build the Linux `vpsinfo-gui` binary and, on version tags, publish a
# GitHub Release with versioned artifacts.
#
#   - Every push / PR to `main`  -> build + test + upload CI artifacts
#   - Tag push `vX.Y.Z`          -> same build, plus a GitHub Release named
#                                   `vX.Y.Z` with the binaries attached
#   - Manual run via the Actions tab (workflow_dispatch)
#
# Linux-only by design: the artifact is a self-contained ELF binary (the
# script + font are embedded), so there is no macOS/Windows matrix.

name: Build & Release (Linux GUI)

on:
  push:
    branches: [main]
    tags: ['v*'] # vX.Y.Z tags publish a GitHub Release
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # needed to publish GitHub Releases from tags

jobs:
  build-linux:
    name: Build vpsinfo-gui (Linux)
    # Pin the runner (not ubuntu-latest): the label migrates to Ubuntu 26 in
    # Oct 2026, and we only use the host for the runner + container anyway.
    runs-on: ubuntu-24.04
    # Build inside an old-but-still-supported container so the binary links
    # against an older glibc (a fresh runner image would give a much newer
    # one). Ubuntu 22.04 (jammy) => glibc 2.35, in standard support until
    # April 2027 (Debian 11 is EOL and its apt repos already 404 — don't use
    # it here). The result then runs on anything Debian 12+ / Ubuntu 22.04+.
    container:
      image: ubuntu:22.04
    defaults:
      run:
        # Steps inside a `container` job run with the container's default
        # shell (/bin/sh), where `set -o pipefail` is illegal and ${VAR::8}
        # doesn't parse. Force bash so the scripts below behave as written.
        shell: bash
    steps:
      - name: Base tooling for the container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl pkg-config build-essential

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install eframe/egui Linux libraries
        # Same package set the egui project uses for its own Linux CI
        # (X11 + Wayland + GL development headers at build time).
        run: |
          apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libgtk-3-dev libglib2.0-dev \
            libwayland-dev libx11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libgles2-mesa-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui

      # Versioning: tag builds use the tag (`v0.2.0` -> `0.2.0`), everything
      # else uses the Cargo.toml version + short commit SHA so each CI run has
      # a unique, sortable artifact suffix.
      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            CARGO_VER="$(sed -n 's/^version = "\(.*\)"/\1/p' gui/Cargo.toml | head -n1)"
            VER="${CARGO_VER}-${GITHUB_SHA::8}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked --manifest-path gui/Cargo.toml

      - name: Run tests
        run: cargo test --locked --manifest-path gui/Cargo.toml

      - name: Smoke test the binary (headless CLI face of the same binary)
        run: |
          ./gui/target/release/vpsinfo-gui --generate --dry-run | grep -q '^VPSINFO_SHOW_SUMMARY='

      - name: Package artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          NAME="vpsinfo-gui-${VERSION}-linux-x86_64"
          install -m 0755 gui/target/release/vpsinfo-gui "artifacts/${NAME}"
          tar -C artifacts -czf "artifacts/${NAME}.tar.gz" "${NAME}"
          (cd artifacts && sha256sum "${NAME}" "${NAME}.tar.gz" > SHA256SUMS.txt)
          ls -lh artifacts

      - name: Upload artifacts (every run)
        uses: actions/upload-artifact@v7
        with:
          name: vpsinfo-gui-${{ steps.version.outputs.version }}-linux-x86_64
          path: artifacts/

      - name: Publish GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true