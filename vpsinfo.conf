# vpsinfo configuration — read by vps-info.sh (also generated by vpsinfo-gui).
# Location: ~/.config/vpsinfo/vpsinfo.conf  (override with $VPSINFO_CONF)
# Syntax:   KEY=VALUE  (1 = on / show, 0 = off / hide)
# Priority: environment variables always win over this file.
# Baked/standalone exports set VPSINFO_NO_CONFIG=1 and never read this file.

# --- Sections (default: all ON) -------------------------------------
VPSINFO_SHOW_SUMMARY=1
VPSINFO_SHOW_BANNER=1
VPSINFO_SHOW_SYSTEM=1
VPSINFO_SHOW_CPU=1
VPSINFO_SHOW_MEMORY=1
VPSINFO_SHOW_DISK=1
VPSINFO_SHOW_NETWORK=1
VPSINFO_SHOW_PROCESSES=1
VPSINFO_SHOW_DOCKER=1
VPSINFO_SHOW_WEB=1
VPSINFO_SHOW_PORTS=1
VPSINFO_SHOW_SECURITY=1
VPSINFO_SHOW_MAINT=1
VPSINFO_SHOW_TOOLS=1
VPSINFO_SHOW_FOOTER=1

# --- Appearance ------------------------------------------------------
VPSINFO_FRAME=1
# VPSINFO_COLOR=auto | always | never
VPSINFO_COLOR=auto

# --- Behavior (skip flags: 1 = skip) ---------------------------------
#VPSINFO_SKIP_CPU=0       # live CPU sample (~0.2s)
#VPSINFO_SKIP_UPDATES=0   # apt/dnf update counts
#NO_PUBLIC_IP=0           # public IP + Geo lookups
#VPSINFO_SKIP_GEO=0       # Geo/ASN lookup (still shows public IP)